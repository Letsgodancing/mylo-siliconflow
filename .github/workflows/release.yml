name: Release — build & push multi-arch add-on images

# Triggers on version tags: v1.0.0, v1.2.3, etc.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

defaults:
  run:
    working-directory: mylo_siliconflow

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pyyaml
      - run: python scripts/validate_release.py "${GITHUB_REF_NAME#v}"
      - run: pytest tests/unit

  build:
    needs: [validate, ci]
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]
        include:
          - arch: amd64
            build_from: ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20
            platform: linux/amd64
          - arch: aarch64
            build_from: ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.20
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        env:
          TAG_REF: ${{ github.ref }}
        run: echo "version=${TAG_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'aarch64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./mylo_siliconflow
          file: ./mylo_siliconflow/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}
          tags: |
            ${{ env.REGISTRY }}/letsgodancing/${{ matrix.arch }}-addon-mylo-siliconflow:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/letsgodancing/${{ matrix.arch }}-addon-mylo-siliconflow:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=Mylo SiliconFlow
            org.opencontainers.image.description=AI agent for Home Assistant
            org.opencontainers.image.source=https://github.com/Letsgodancing/mylo-siliconflow
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify anonymous GHCR downloads for both architectures
        run: python scripts/verify_public_images.py "${GITHUB_REF_NAME#v}"
      - name: Publish release after image verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Mylo SiliconFlow $GITHUB_REF_NAME" --notes-file docs/SILICONFLOW_RELEASE.md
